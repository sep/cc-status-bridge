name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0) — only used for manual runs"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe_suffix: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-arm64
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify version.txt matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < version.txt)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $tag_version does not match version.txt ($file_version) — bump version.txt before tagging"
            exit 1
          fi
          echo "version: $file_version"

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r ${{ matrix.rid }}
          -o out/${{ matrix.rid }}

      - name: Rename artifact
        shell: bash
        run: |
          cd out/${{ matrix.rid }}
          mv "ClaudeStatusBridge${{ matrix.exe_suffix }}" "ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}"

      # Ad-hoc codesign on macOS. .NET's publish step usually does this
      # already on osx-arm64, but we re-sign defensively to make sure both
      # x64 and arm64 binaries are signed identically. This does NOT bypass
      # Gatekeeper for downloaded files (notarization would, but that needs
      # an Apple Developer cert) — it just ensures the binary actually runs
      # on Apple Silicon, which requires at-least-ad-hoc signing.
      - name: Ad-hoc codesign (macOS only)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          binary="out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}"
          codesign --force --deep --sign - "$binary"
          codesign --verify --verbose "$binary"

      # ============================================================
      # Wrap the raw binary in a platform-native installer so end users
      # don't have to download an EXE + run shell commands. The raw
      # binary is still uploaded too, for power users / CI consumers.
      # ============================================================

      - name: Build NSIS installer (Windows)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          version="$(tr -d '[:space:]' < version.txt)"
          # cygpath -w gives a native Windows path (backslashes, drive
          # letter form). Without it, $PWD returns a POSIX-style
          # /d/a/... that MSYS half-converts in argv and that NSIS's
          # File directive does not reliably resolve.
          binary="$(cygpath -w "$PWD/out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}")"
          echo "--- contents of out/${{ matrix.rid }}/ ---"
          ls -la "out/${{ matrix.rid }}/"
          echo "--- BINARY=${binary} ---"
          # makensis accepts both /D and -D for compile-time defines.
          # Use -D under bash on Windows: the leading-slash form trips
          # MSYS path conversion, which rewrites "/DVERSION=0.3.0" into
          # "C:/Program Files/Git/DVERSION=0.3.0" before makensis sees it.
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            "-DVERSION=${version}" "-DBINARY=${binary}" \
            installer/windows/installer.nsi
          ls -la installer/windows/

      - name: Build .app bundle and .dmg (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          binary="$PWD/out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}"
          installer/macos/build-bundle.sh "${version}" "${{ matrix.rid }}" "${binary}"
          ls -la *.dmg

      - name: Build AppImage (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          version="$(tr -d '[:space:]' < version.txt)"
          binary="$PWD/out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}"
          installer/linux/build-appimage.sh "${version}" "${binary}"
          ls -la *.AppImage

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: installer/windows/ClaudePanelBridge-*-Setup.exe
          if-no-files-found: error

      - name: Upload macOS .dmg
        if: startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: ClaudePanelBridge-*-${{ matrix.rid }}.dmg
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: ClaudePanelBridge-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten + checksum
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "--- release dir ---"
          ls -la
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            **Recommended — platform-native installers:**

            | Platform                 | Download                                              |
            |--------------------------|-------------------------------------------------------|
            | Windows x64              | `ClaudePanelBridge-*-Setup.exe`                       |
            | macOS Apple Silicon      | `ClaudePanelBridge-*-osx-arm64.dmg`                   |
            | macOS Intel              | `ClaudePanelBridge-*-osx-x64.dmg`                     |
            | Linux x64                | `ClaudePanelBridge-*-x86_64.AppImage`                 |

            - **Windows:** double-click the `*-Setup.exe`. Per-user install,
              no admin needed. Installs to `%LOCALAPPDATA%`, registers in
              Apps & Features, writes the standard
              `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` entry
              so the bridge starts at login, and drops a tray icon.
              SmartScreen may warn "publisher not verified" on first run;
              click "More info → Run anyway."
            - **macOS:** open the `.dmg`, drag `ClaudePanelBridge.app` into
              `Applications`, then double-click it. The app lives in your
              menu bar (no Dock icon — it's a tray-only app).
              First launch may need: System Settings → Privacy & Security
              → "Open Anyway" because the bundle is ad-hoc signed but not
              notarized.
            - **Linux:** `chmod +x ClaudePanelBridge-*-x86_64.AppImage`
              and run it. Tray icon may need a system-tray extension on
              GNOME (KStatusNotifierItem / AppIndicator).

            **For scripted installs / CI / power users — raw binaries:**

            | Platform            | File                                  |
            |---------------------|---------------------------------------|
            | Windows x64         | `ClaudeStatusBridge-win-x64.exe`      |
            | Linux x64           | `ClaudeStatusBridge-linux-x64`        |
            | macOS Apple Silicon | `ClaudeStatusBridge-osx-arm64`        |
            | macOS Intel         | `ClaudeStatusBridge-osx-x64`          |

            On macOS the raw binary needs the quarantine cleared:

            ```bash
            chmod +x ClaudeStatusBridge-osx-arm64
            xattr -dr com.apple.quarantine ./ClaudeStatusBridge-osx-arm64
            ./ClaudeStatusBridge-osx-arm64 install
            ```

            Verify file integrity against `SHA256SUMS.txt` if you want.

            ## Subcommands

            `install` / `uninstall` / `start` / `stop` / `restart` /
            `status` / `version` / `logs` / `find` —
            see `--help` for details. (`match` is kept as a legacy
            alias for `find`.)
