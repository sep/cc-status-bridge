name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0) — only used for manual runs"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe_suffix: ".exe"
          - os: ubuntu-latest
            rid: linux-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-x64
            exe_suffix: ""
          - os: macos-latest
            rid: osx-arm64
            exe_suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify version.txt matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < version.txt)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $tag_version does not match version.txt ($file_version) — bump version.txt before tagging"
            exit 1
          fi
          echo "version: $file_version"

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r ${{ matrix.rid }}
          -o out/${{ matrix.rid }}

      - name: Rename artifact
        shell: bash
        run: |
          cd out/${{ matrix.rid }}
          mv "ClaudeStatusBridge${{ matrix.exe_suffix }}" "ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/ClaudeStatusBridge-${{ matrix.rid }}${{ matrix.exe_suffix }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + checksum
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "--- release dir ---"
          ls -la
          echo "--- checksums ---"
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
