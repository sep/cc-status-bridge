title: ClaudePanel Bridge
description: Cross-platform USB-serial transport for the ClaudePanel external status display.
theme: jekyll-theme-cayman

# url + baseurl deliberately omitted — GitHub Pages auto-injects them
# for project sites (https://<org>.github.io/<repo>).

show_downloads: false

# Stamped at deploy time by .github/workflows/docs.yml — kept empty by
# default so a local `bundle exec jekyll serve` build still works.
# Installer links in index.md fall back to the generic /releases page
# when these are unset.
bridge_version: ""
bridge_release_tag: ""

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
